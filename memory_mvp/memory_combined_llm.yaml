name: memory_combined_llm
description: "The combined memory layer with model-driven agents — each decides for itself what to record, an external observer reads the same run's trace independently, both lanes pass one write contract into a git-versioned store, and every cross-agent read is a policy decision."
seed: 42
layers:
  memory: git.v1
plugin_files:
  - memory_combined.py
validator: memory_combined_llm
agents:
  - name: agent-a
    role: git-llm-asker
    config: {sku: widget, quantity: 2, rounds: 2}
  - name: agent-b
    role: git-llm-answerer
    config: {sku: widget, unit_cents: 1995}
faults: []
max_time: 120
